  <style>
    :root {
      --ssa-blue: #003366;
      --ssa-light: #f2f2f2;
      --ssa-accent: #005ea2;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--ssa-light);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: white;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 35px 30px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    .logo img {
      width: 90px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 22px;
      color: var(--ssa-blue);
      margin-bottom: 15px;
    }
    p {
      font-size: 15px;
      color: #333;
      margin-bottom: 15px;
    }
    .click-here {
      color: var(--ssa-accent);
      text-decoration: underline;
      cursor: pointer;
      font-weight: bold;
    }
    .click-here:hover {
      opacity: 0.8;
    }
    .progress-bar {
      width: 100%;
      height: 6px;
      background-color: #ddd;
      border-radius: 3px;
      overflow: hidden;
      margin: 20px 0;
    }
    .progress {
      width: 0%;
      height: 100%;
      background-color: var(--ssa-accent);
      transition: width 2s ease-in-out;
    }
    .footer {
      font-size: 13px;
      color: #666;
      margin-top: 20px;
    }
    .footer a {
      color: var(--ssa-accent);
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
